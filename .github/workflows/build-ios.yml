name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Prepare Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run core tests on an isolated simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -resolvePackageDependencies \
            -project ios-app/PhoneAgent.xcodeproj -scheme PhoneAgent \
            -clonedSourcePackagesDirPath .build/SourcePackages
          xcrun simctl list devices available -j > "$RUNNER_TEMP/phoneagent-devices.json"
          SOURCE_SIMULATOR=$(python3 -c 'import json,sys; groups=json.load(open(sys.argv[1]))["devices"]; candidates=[(tuple(map(int,k.rsplit("iOS-",1)[1].split("-"))),d["udid"]) for k,ds in groups.items() if ".iOS-" in k and int(k.rsplit("iOS-",1)[1].split("-")[0]) >= 27 for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]; assert candidates, "No available iOS 27+ iPhone simulator"; print(max(candidates)[1])' "$RUNNER_TEMP/phoneagent-devices.json")
          SIMULATOR=$(xcrun simctl clone "$SOURCE_SIMULATOR" "PhoneAgent-CI-$GITHUB_RUN_ID")
          trap 'xcrun simctl delete "$SIMULATOR"' EXIT
          bash ios-app/scripts/test_core.sh "$SIMULATOR" 2>&1 | tee artifacts/core-tests.log

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project ios-app/PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DeviceBuild \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/DeviceBuild/Build/Products/Release-iphoneos/PhoneAgent.app"
          test -d "$APP"
          mkdir -p .build/ipa/Payload
          ditto "$APP" .build/ipa/Payload/PhoneAgent.app
          cd .build/ipa
          zip -qry "$GITHUB_WORKSPACE/artifacts/PhoneAgent-unsigned.ipa" Payload

      - name: Upload package and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
