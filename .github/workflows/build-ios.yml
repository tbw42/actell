name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Prepare Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run core tests on an isolated simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -resolvePackageDependencies \
            -project ios-app/PhoneAgent.xcodeproj -scheme PhoneAgent \
            -clonedSourcePackagesDirPath .build/SourcePackages
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/phoneagent-runtimes.json"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/phoneagent-devicetypes.json"
          RUNTIME=$(python3 -c 'import json,sys; rs=[r for r in json.load(open(sys.argv[1]))["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and int(r["version"].split(".")[0]) >= 27]; assert rs, "No iOS 27+ simulator runtime installed"; print(max(rs,key=lambda r: tuple(map(int,r["version"].split("."))))["identifier"])' "$RUNNER_TEMP/phoneagent-runtimes.json")
          DEVICE=$(python3 -c 'import json,sys; ds=[d for d in json.load(open(sys.argv[1]))["devicetypes"] if d.get("productFamily")=="iPhone"]; assert ds, "No iPhone simulator device type installed"; print(ds[-1]["identifier"])' "$RUNNER_TEMP/phoneagent-devicetypes.json")
          SIMULATOR=$(xcrun simctl create "PhoneAgent-CI-$GITHUB_RUN_ID" "$DEVICE" "$RUNTIME")
          trap 'xcrun simctl delete "$SIMULATOR"' EXIT
          bash ios-app/scripts/test_core.sh "$SIMULATOR" 2>&1 | tee artifacts/core-tests.log

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project ios-app/PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DeviceBuild \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/DeviceBuild/Build/Products/Release-iphoneos/PhoneAgent.app"
          test -d "$APP"
          mkdir -p .build/ipa/Payload
          ditto "$APP" .build/ipa/Payload/PhoneAgent.app
          cd .build/ipa
          zip -qry "$GITHUB_WORKSPACE/artifacts/PhoneAgent-unsigned.ipa" Payload

      - name: Upload package and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
